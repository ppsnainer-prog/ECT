<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Скрипты ЕЦТ — Единый центр телефонии</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Login gate -->
  <section id="loginScreen" class="login-screen" aria-label="Вход">
    <div class="login-card">
      <div class="login-logo">📞</div>
      <h1>ЕЦТ Скрипты</h1>
      <p class="login-subtitle">Закрытый доступ для команды</p>

      <div class="login-field">
        <label for="loginUser">Пользователь</label>
        <select id="loginUser">
          <option value="">Выберите пользователя</option>
          <option value="Александр">Александр</option>
          <option value="Айнур">Айнур</option>
          <option value="Илья">Илья</option>
          <option value="Екатерина">Екатерина</option>
          <option value="Общая">Общая — только просмотр</option>
        </select>
      </div>

      <div class="login-field">
        <label for="loginPassword">Пароль</label>
        <div class="password-wrap">
          <input id="loginPassword" type="password" autocomplete="current-password"
                 placeholder="Введите пароль" />
          <button type="button" class="password-toggle" id="toggleLoginPassword" aria-label="Показать пароль">◉</button>
        </div>
      </div>

      <button class="btn btn-primary login-button" id="loginButton">Войти</button>
      <p class="login-error" id="loginError" role="alert"></p>
      <p class="login-note">Доступ только для участников команды.</p>
    </div>
  </section>

  <div id="app" hidden>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">📞</span>
          <span class="logo-text">ЕЦТ Скрипты</span>
        </div>
        <button class="btn-icon sidebar-toggle" id="sidebarToggle" title="Свернуть">☰</button>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="home">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Главная</span>
        </button>
        <button class="nav-item" data-page="scripts">
          <span class="nav-icon">📜</span>
          <span class="nav-label">Скрипты</span>
        </button>
        <button class="nav-item" data-page="otabotki">
          <span class="nav-icon">🔄</span>
          <span class="nav-label">Отработки</span>
        </button>
        <button class="nav-item" data-page="catalog">
          <span class="nav-icon">🚗</span>
          <span class="nav-label">Автокаталог</span>
        </button>
        <button class="nav-item" data-page="settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Настройки</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-sm btn-outline" id="exportData">Экспорт</button>
        <button class="btn btn-sm btn-outline" id="importData">Импорт</button>
        <input type="file" id="importFile" accept=".json" hidden />
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="pageTitle">Главная</h1>
        </div>
        <div class="topbar-right">
          <span class="login-user-badge" id="currentUserBadge"></span>
          <button class="btn btn-sm btn-outline logout-btn" id="logoutBtn" title="Выйти из аккаунта">Выйти</button>
          <span class="sync-badge local" id="syncBadge" title="Статус синхронизации">Локально</span>
          <button class="btn btn-primary" id="addScriptBtn" style="display:none">+ Новый скрипт</button>
          <button class="btn-icon" id="themeToggle" title="Тема">🌙</button>
        </div>
      </header>

      <div class="content" id="content">
        <!-- Pages will be rendered here -->
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Модальное окно</h2>
        <button class="btn-icon modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
